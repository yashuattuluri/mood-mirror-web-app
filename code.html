<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Decision Spinner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1> Decision Spinner</h1>
    <p>Can't decide? Let the spinner choose for you.</p>

    <textarea id="options" placeholder="Enter options (one per line)"></textarea>
    <button onclick="spin()">Spin</button>

    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
